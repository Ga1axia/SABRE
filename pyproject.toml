[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabre"
version = "0.1.0"
description = "Self-improving Agent Business Recursive Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Taihei Eastwood" }]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "slack-bolt>=1.20",
    "slack-sdk>=3.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sabre = "core.cli.__main__:main"

[project.entry-points."sabre.drivers.inference"]
openai_compat = "core.drivers.inference.openai_compat:OpenAICompatDriver"

[project.entry-points."sabre.drivers.messaging"]
slack = "core.drivers.messaging.slack:SlackDriver"

[project.entry-points."sabre.drivers.cards"]
disabled = "core.drivers.cards.disabled:DisabledCardDriver"
memory = "core.drivers.cards.memory:MemoryCardDriver"
lithic = "core.drivers.cards.lithic:LithicCardDriver"

[project.entry-points."sabre.drivers.payments"]
disabled = "core.drivers.payments.disabled:DisabledPaymentDriver"
memory = "core.drivers.payments.memory:MemoryPaymentDriver"
stripe = "core.drivers.payments.stripe:StripePaymentDriver"

[project.entry-points."sabre.drivers.hosting"]
disabled = "core.drivers.hosting.disabled:DisabledHostingDriver"

[project.entry-points."sabre.drivers.alerts"]
memory = "core.drivers.alerts.memory:MemoryAlertDriver"
smtp = "core.drivers.alerts.smtp:SmtpAlertDriver"

[tool.setuptools.packages.find]
include = ["core*", "sabre*"]

[tool.setuptools.package-data]
core = [
    "defaults.yaml",
    "schema.sql",
    "migrations/*.sql",
    "channels/*.md",
    "slack/*.tmpl",
    "services/*",
    "web/templates/*",
    "runtime/personas/*.md",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "stage_h: POSIX-only or target-platform tests deferred to Stage H",
]
